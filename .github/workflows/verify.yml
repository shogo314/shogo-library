name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 新しい push が来たら古い実行をキャンセルする (検証結果の push が競合して落ちるのを防ぐ)
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 に切り替わるので、動作確認済みの 24.04 に固定する
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip3 install online-judge-verify-helper

    - name: Run tests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ドキュメントを gh-pages ブランチに push して GitHub Pages で公開する
        GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
      run: oj-verify all -j $(nproc) --timeout=6000
