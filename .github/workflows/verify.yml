name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 新しい push が来たら古い実行をキャンセルする (検証結果の push が競合して落ちるのを防ぐ)
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 に切り替わるので、動作確認済みの 24.04 に固定する
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip3 install online-judge-verify-helper

    # 多くのテストを検証し直すと、Library Checker のテストケースでディスクがあふれる (2026-11-03 に落ちた)
    # 使わないツールを消して空ける
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /

    - name: Run tests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ドキュメントを gh-pages ブランチに push して GitHub Pages で公開する
        GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
      run: oj-verify all -j $(nproc) --timeout=6000

  local-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        standard: [gnu++17, gnu++20]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Check standalone headers and unit tests
      run: python3 tools/check_library.py headers unittests --std ${{ matrix.standard }} --jobs 2

  sanitizers:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Check boundary cases with AddressSanitizer and UBSan
      run: python3 tools/check_library.py sanitizers --std gnu++20 --jobs 2

  documentation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Check Liquid syntax and header references
      run: python3 tools/check_library.py docs

  # .clang-format で整形済みかだけを確かめる (整形はしない)
  format:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    # 版によって整形の結果が変わることがあるので固定する
    - name: Install clang-format
      run: pip3 install clang-format==19.1.7

    - name: Check formatting
      run: find src test \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
